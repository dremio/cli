name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v8.0.0
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/dremio-cli/
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  update-plugin-version:
    # main is protected by the "Lock main" ruleset; dremio-release-bot is its
    # only bypass actor. Its key lives in the pypi environment, which only v*
    # tags can deploy to, so no other workflow or branch can read it.
    needs: publish
    runs-on: ubuntu-latest
    environment: pypi
    permissions: {}
    steps:
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app-token
        with:
          client-id: Iv23liSGL4udxvGMF91W # dremio-release-bot
          private-key: ${{ secrets.DREMIO_RELEASE_BOT_PRIVATE_KEY }}
          repositories: cli
          permission-contents: write
      - uses: actions/checkout@v6
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}
      - name: Update plugin.json version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" '.version = $v' plugins/dremio/.claude-plugin/plugin.json > tmp.json
          mv tmp.json plugins/dremio/.claude-plugin/plugin.json
      - name: Commit and push
        run: |
          git config user.name "dremio-release-bot[bot]"
          git config user.email "223908024+dremio-release-bot[bot]@users.noreply.github.com"
          git add plugins/dremio/.claude-plugin/plugin.json
          git diff --cached --quiet || git commit -m "chore: bump plugin version to ${GITHUB_REF_NAME#v}"
          git push
